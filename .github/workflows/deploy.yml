- name: Deploy ke Hostinger via SSH
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        ARGS: "-avz --delete"
        REMOTE_HOST: ${{ secrets.SSH_HOST }}
        REMOTE_USER: ${{ secrets.SSH_USERNAME }}
        REMOTE_PORT: ${{ secrets.SSH_PORT }}
        
        # Mengirim seluruh folder proyek Laravel
        SOURCE: "./" 
        
        # Tujuan folder subdomain di Hostinger
        TARGET: "/home/u574336825/domains/sayang-it.com/public_html/sub-farhan3"
        
        # Mengecualikan folder berat dan file rahasia agar tidak dikirim/dihapus
        EXCLUDE: "/node_modules/, /.git/, /.github/, /.env"