name: Deploy Laravel + SvelteKit ke Hostinger

on:
  push:
    branches:
      - main # Akan jalan otomatis saat ada push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode terbaru dari repositori GitHub
    - name: Mengambil kode dari GitHub
      uses: actions/checkout@v4

    # 2. Setup PHP dan Install Dependensi Laravel (Composer)
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Sesuaikan dengan versi PHP yang Anda pakai
    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader

    # 3. Setup Node.js dan Build Frontend (Vite/SvelteKit)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install NPM Dependencies & Build Vite
      run: |
        npm ci --legacy-peer-deps
        npm run build

    # 4. Mengirim keseluruhan file ke Hostinger
    - name: Deploy ke Hostinger via SSH
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        ARGS: "-avz --delete"
        REMOTE_HOST: ${{ secrets.SSH_HOST }}
        REMOTE_USER: ${{ secrets.SSH_USERNAME }}
        REMOTE_PORT: ${{ secrets.SSH_PORT }}
        
        # Kirim seluruh folder proyek (termasuk folder vendor dan public/build)
        SOURCE: "./" 
        
        # Tujuan folder subdomain di Hostinger Anda
        TARGET: "/home/u574336825/domains/sayang-it.com/public_html/sub-farhan3"
        
        # Kecualikan folder berat/mentah dan file rahasia agar aman
        EXCLUDE: "/node_modules/, /.git/, /.github/, /.env"
